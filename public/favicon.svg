<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="forgeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366F1" />
      <stop offset="50%" stop-color="#4F46E5" />
      <stop offset="100%" stop-color="#7C3AED" />
    </linearGradient>
    <linearGradient id="metalGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#C7D2FE" stop-opacity="0.8" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#4F46E5" flood-opacity="0.35" />
    </filter>
  </defs>
  <!-- Background Rounded Shield / Squircle -->
  <rect x="32" y="32" width="448" height="448" rx="112" fill="url(#forgeGrad)" filter="url(#glow)" />
  
  <!-- Subtle Internal Highlight Stroke -->
  <rect x="34" y="34" width="444" height="444" rx="110" stroke="white" stroke-opacity="0.2" stroke-width="4" />
  
  <!-- Geometric Hammer & Anvil / Stylized IF Icon -->
  <g transform="translate(116, 116)">
    <!-- Base Anvil / Foundation -->
    <path d="M40 210 C40 190, 60 170, 90 170 L190 170 C220 170, 240 190, 240 210 C240 226, 226 240, 210 240 L70 240 C54 240, 40 226, 40 210 Z" fill="url(#metalGrad)" />
    
    <!-- Stylized Diamond Forge Spark (Top Right) -->
    <polygon points="210,40 235,80 210,120 185,80" fill="#38BDF8" />
    <polygon points="210,55 225,80 210,105 195,80" fill="#FFFFFF" />

    <!-- Stylized "F" / Forge Column -->
    <path d="M75 50 L160 50 C175 50, 185 60, 185 75 L185 85 C185 100, 175 110, 160 110 L125 110 L125 130 L155 130 C165 130, 172 137, 172 147 L172 153 C172 163, 165 170, 155 170 L75 170 C60 170, 50 158, 50 143 L50 77 C50 62, 60 50, 75 50 Z" fill="url(#metalGrad)" />

    <!-- Spark particles -->
    <circle cx="90" cy="30" r="6" fill="#F472B6" />
    <circle cx="230" cy="140" r="5" fill="#FBBF24" />
  </g>
</svg>
